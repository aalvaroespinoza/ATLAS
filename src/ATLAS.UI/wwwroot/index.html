<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ATLAS</title>
    <base href="/" />
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    },
                    colors: {
                        atlas: {
                            bg: '#090d16',
                            card: 'rgba(17, 24, 39, 0.75)',
                            cardhover: 'rgba(31, 41, 55, 0.85)',
                            border: 'rgba(51, 65, 85, 0.5)',
                            accent: '#38bdf8'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="app.css" />
    <link rel="icon" href="data:,">
</head>

<body class="bg-[#090d16] text-slate-100 font-sans antialiased select-none overflow-hidden">

    <div id="app" class="h-screen w-screen flex">
        <div class="flex items-center justify-center w-full h-full text-slate-400 text-sm">
            Iniciando ATLAS...
        </div>
    </div>

    <div id="blazor-error-ui" class="hidden" data-nosnippet>
        Ocurrió un error no controlado.
        <a href="." class="reload text-sky-400 underline">Recargar</a>
        <span class="dismiss cursor-pointer">🗙</span>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
</body>
</html>
