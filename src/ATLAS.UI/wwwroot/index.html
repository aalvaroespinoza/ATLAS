<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ATLAS</title>
    <base href="/" />
    
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Tailwind Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                        mono: ['JetBrains Mono', 'Menlo', 'Consolas', 'monospace']
                    },
                    colors: {
                        atlas: {
                            canvas: '#090b10',
                            dock: '#10141e',
                            surface: '#121724',
                            surfaceHover: '#181f30',
                            elevated: '#171e2e',
                            border: 'rgba(255, 255, 255, 0.07)',
                            borderSubtle: 'rgba(255, 255, 255, 0.12)',
                            accent: '#6366f1',
                            accentGlow: '#818cf8',
                            accentSubtle: 'rgba(99, 102, 241, 0.12)',
                            success: '#10b981',
                            warning: '#f59e0b',
                            danger: '#f43f5e',
                            muted: '#64748b'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="app.css" />
    <link rel="icon" href="data:,">
</head>

<body class="bg-[#090b10] text-slate-100 font-sans antialiased select-none overflow-hidden">

    <div id="app" class="h-screen w-screen flex">
        <div class="flex items-center justify-center w-full h-full text-slate-500 text-xs font-mono">
            ATLAS OS
        </div>
    </div>

    <div id="blazor-error-ui" class="hidden" data-nosnippet>
        Ocurrió un error no controlado.
        <a href="." class="reload text-indigo-400 underline">Recargar</a>
        <span class="dismiss cursor-pointer">🗙</span>
    </div>

    <script src="_framework/blazor.webview.js"></script>
</body>
</html>
